<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberChat · Acceso móvil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 28px 24px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #94a3b8; line-height: 1.5; font-size: 14px; margin-bottom: 16px; }
    .url {
      display: block;
      word-break: break-all;
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      color: #2dd4bf;
      margin: 16px 0;
      text-decoration: none;
    }
    #qr { margin: 12px auto; border-radius: 12px; background: #fff; padding: 10px; }
    .steps { text-align: left; font-size: 13px; color: #cbd5e1; margin-top: 20px; }
    .steps li { margin: 8px 0 8px 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Únete al chat desde tu celular</h1>
    <p>Escanea el código QR o abre el enlace. Debes estar en la <strong>misma red WiFi</strong> que la computadora de la demo.</p>
    <img id="qr" width="220" height="220" alt="Código QR" />
    <a class="url" id="mobile-link" href="#" target="_blank" rel="noopener"></a>
    <ol class="steps">
      <li>Conéctate al WiFi de la feria / del aula.</li>
      <li>Escanea el QR o toca el enlace.</li>
      <li>Escribe un mensaje: se verá en la pantalla grande con CyberLens.</li>
    </ol>
  </div>
  <script>
    fetch('/api/access')
      .then((r) => r.json())
      .then((data) => {
        const url = data.url_mobile || data.url_chat;
        const link = document.getElementById('mobile-link');
        link.href = url;
        link.textContent = url;
        document.getElementById('qr').src =
          `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}`;
      })
      .catch(() => {
        document.getElementById('mobile-link').textContent = 'Inicia CyberChat en la PC primero';
      });
  </script>
</body>
</html>
